<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; }
      .slide-container {
        width: 1280px;
        min-height: 720px;
        box-sizing: border-box;
        background: #FAFAFA;
        display: flex;
        align-items: center;
        font-family: 'Inter', sans-serif;
      }
      .left-section {
        width: 60%;
        padding: 80px 60px 80px 80px;
      }
      .divider {
        width: 3px;
        height: 400px;
        background: #415A77;
      }
      .right-section {
        width: 35%;
        padding: 80px 60px 80px 50px;
      }
      .main-title {
        font-size: 44px;
        font-weight: 700;
        color: #0D1B2A;
        line-height: 1.2;
        margin-bottom: 24px;
      }
      .subtitle {
        font-size: 20px;
        font-weight: 400;
        color: #415A77;
        line-height: 1.5;
      }
      .context-label {
        font-size: 14px;
        font-weight: 600;
        color: #415A77;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 16px;
      }
      .context-text {
        font-size: 18px;
        font-weight: 400;
        color: #1B263B;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .pill {
        display: inline-block;
        background: #415A77;
        color: #FAFAFA;
        padding: 6px 16px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 600;
      }
    </style>
</head>
<body>
    <div class="slide-container">
      <div class="left-section">
        <div class="main-title">Paper Validation Upgrade:<br>Single-Annotator to<br>Multi-Annotator Protocol</div>
        <div class="subtitle">AIES 2026 Submission — Kidfluencer Exploitation Audit</div>
      </div>
      <div class="divider"></div>
      <div class="right-section">
        <div class="context-label">Addressing</div>
        <div class="context-text">Reviewer Weakness W2<br>(Major — Validation Protocol)</div>
        <div class="pill">Revision Summary</div>
      </div>
    </div>
</body>
</html>
